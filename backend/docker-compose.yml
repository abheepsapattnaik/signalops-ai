version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: signalops-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signalops_ai
      POSTGRES_USER: signalops
      POSTGRES_PASSWORD: signalops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
