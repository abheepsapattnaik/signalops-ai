server:
  port: 8080

spring:
  application:
    name: signalops-ai-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/signalops_ai
    username: signalops
    password: signalops
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
